<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Canvas</title>
<style>
  :root{
    --bg:#121212;--panel:#1c1c1c;--input-bg:#0f0f0f;--card:#181818;--card-header:#202020;
    --hover-1:#252525;--hover-2:#333;--hover-3:#3a3a3a;--border:#333;--border-soft:#2a2a2a;
    --secondary-bg:#2a2a2a;--grid:#2a2a2a;--canvas-bg:#151515;
    --accent:#1db954;--accent-hover:#1ed760;--text:#eee;--muted:#888;--muted2:#555;
    --shadow:rgba(0,0,0,.5);--shadow-strong:rgba(0,0,0,.6);--outline-dash:rgba(255,255,255,.28);
    --scrub-track:#333;--scrub-handle:#fff;
  }
  :root[data-theme="light"]{
    --bg:#f5f5f7;--panel:#ffffff;--input-bg:#eef0f2;--card:#ffffff;--card-header:#f0f1f3;
    --hover-1:#eceef0;--hover-2:#e2e4e7;--hover-3:#dadde0;--border:#dcdce0;--border-soft:#e3e4e7;
    --secondary-bg:#e7e8ea;--grid:#d8d9dc;--canvas-bg:#eceef0;
    --accent:#1db954;--accent-hover:#17a34a;--text:#1c1c1e;--muted:#68686d;--muted2:#a3a3a8;
    --shadow:rgba(20,20,30,.10);--shadow-strong:rgba(20,20,30,.16);--outline-dash:rgba(0,0,0,.25);
    --scrub-track:#dcdce0;--scrub-handle:#1c1c1e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;transition:background .15s,color .15s;}
  #toolbar{position:fixed;top:0;left:0;right:0;min-height:56px;background:var(--panel);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;z-index:1000;border-bottom:1px solid var(--border-soft);}
  #toolbar input{flex:0 1 300px;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;}
  #toolbar input:focus{outline:1px solid var(--accent);}
  #toolbar button{background:var(--accent);border:none;color:#000;font-weight:600;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap;}
  #toolbar button:hover{background:var(--accent-hover);}
  #toolbar button.secondary{background:var(--secondary-bg);color:var(--text);}
  #toolbar button.secondary:hover{background:var(--hover-3);}
  #status{font-size:12px;color:var(--muted);white-space:nowrap;}
  #hint{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap;}
  @media (max-width:760px){ #hint{display:none;} #toolbar input{flex:1 1 140px;} }

  #sidebar{position:fixed;top:56px;left:0;bottom:0;width:280px;max-width:80vw;background:var(--panel);border-right:1px solid var(--border-soft);overflow-y:auto;z-index:900;padding:10px;display:none;}
  #sidebar.open{display:block;}
  #sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 6px;}
  #loadPlaylistRow{display:flex;gap:6px;}
  #loadPlaylistRow input{flex:1;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:12px;min-width:0;}
  #loadPlaylistRow button{background:var(--accent);border:none;color:#000;font-weight:600;padding:6px 10px;border-radius:14px;font-size:12px;cursor:pointer;}
  #loadedPlaylistMeta{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4;}
  .pl-item{padding:8px 8px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;}
  .pl-item:hover{background:var(--hover-1);}
  .pl-item.active{background:var(--hover-1);color:var(--accent);}
  .track-item{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;cursor:pointer;font-size:12px;}
  .track-item:hover{background:var(--hover-1);}
  .track-item.playing{background:rgba(29,185,84,.14);}
  .track-item.playing .t{color:var(--accent);}
  .track-item img{width:32px;height:32px;border-radius:4px;flex-shrink:0;}
  .track-item .meta{overflow:hidden;flex:1;}
  .track-item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track-item .a{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track-item .tapadd{background:var(--secondary-bg);border:none;color:var(--accent);border-radius:10px;font-size:10px;padding:4px 8px;cursor:pointer;flex-shrink:0;}

  #viewport{position:absolute;top:56px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;
    background-color:var(--canvas-bg);transition:left .15s;}
  #viewport.shifted{left:280px;}
  #viewport.panning{cursor:grabbing;}
  #canvas{position:absolute;top:0;left:0;width:6000px;height:6000px;transform-origin:0 0;
    background-image:radial-gradient(var(--grid) 1px, transparent 1px);
    background-size:24px 24px;background-color:var(--canvas-bg);}

  #zoomControls{position:fixed;bottom:16px;right:16px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:4px 6px;display:flex;align-items:center;gap:2px;z-index:1000;box-shadow:0 4px 14px var(--shadow);}
  #zoomControls button{background:none;border:none;color:var(--text);font-size:16px;width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  #zoomControls button:hover{background:var(--hover-2);}
  #zoomLabel{font-size:11px;color:var(--muted);min-width:38px;text-align:center;cursor:pointer;user-select:none;}

  .card{position:absolute;width:230px;background:var(--card);border-radius:10px;box-shadow:0 4px 14px var(--shadow);overflow:visible;border:1px solid var(--border-soft);user-select:none;}
  .card.playing{box-shadow:0 0 0 2px var(--accent),0 4px 14px var(--shadow);}
  .card-header{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:var(--card-header);cursor:move;font-size:11px;color:var(--muted);border-radius:10px 10px 0 0;}
  .card-header .tag{color:var(--accent);text-transform:uppercase;letter-spacing:.5px;font-size:9px;}
  .card-header .btns{display:flex;gap:4px;align-items:center;}
  .card-header button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 5px;border-radius:4px;}
  .card-header button:hover{background:var(--hover-2);color:var(--text);}
  .card-header .del:hover{background:#c0392b;color:#fff;}
  .embed-wrap{width:100%;min-height:80px;background:var(--input-bg);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;border-radius:0 0 10px 10px;overflow:hidden;}
  .full-card{display:flex;gap:10px;padding:10px;align-items:center;cursor:pointer;}
  .full-card img{width:56px;height:56px;border-radius:6px;flex-shrink:0;}
  .full-card .meta{overflow:hidden;}
  .full-card .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .full-card .a{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .full-card .badge{margin-top:4px;font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;}
  .clip-editor{padding:8px;background:var(--input-bg);border-top:1px solid var(--border-soft);display:none;border-radius:0 0 10px 10px;}
  .clip-editor.open{display:block;}
  .clip-editor .timerow{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .clip-editor input{width:56px;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px;font-size:11px;text-align:center;}
  .clip-editor .makeClipBtn{width:100%;background:var(--accent);border:none;color:#000;font-weight:600;padding:6px;border-radius:6px;font-size:11px;cursor:pointer;}
  .clip-editor .setBtn{width:auto;flex-shrink:0;background:var(--secondary-bg);border:none;color:var(--accent);font-weight:600;padding:4px 9px;border-radius:12px;font-size:10px;cursor:pointer;}
  .clip-editor label{font-size:10px;color:var(--muted);flex-shrink:0;}

  .transport{display:flex;align-items:center;gap:8px;padding:0 10px 10px;}
  .playBtn{background:var(--accent);border:none;color:#000;width:26px;height:26px;min-width:26px;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .seekbar{flex:1;height:6px;background:var(--scrub-track);border-radius:3px;position:relative;cursor:pointer;}
  .seekfill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;width:0%;pointer-events:none;}
  .seekhandle{position:absolute;top:50%;width:10px;height:10px;background:var(--scrub-handle);border-radius:50%;transform:translate(-50%,-50%);left:0%;box-shadow:0 0 2px var(--shadow-strong);pointer-events:none;}
  .timeLabel{font-size:9px;color:var(--muted);white-space:nowrap;flex-shrink:0;}

  .text-body{padding:12px;font-size:14px;line-height:1.5;color:var(--text);min-height:60px;outline:none;white-space:pre-wrap;word-break:break-word;border-radius:0 0 10px 10px;cursor:text;}
  .text-body:empty:before{content:'Type something…';color:var(--muted);}

  /* Freeform text layers (Figma-style): no card box at rest — just the text itself,
     floating directly on the canvas. A dashed outline and small delete button only
     appear on hover or while the layer is selected/being edited. */
  .text-card{background:transparent;border:none;box-shadow:none;}
  .text-card .text-body{padding:6px 8px;min-height:0;border-radius:4px;}
  .text-card:hover .text-body, .text-card.selected .text-body{outline:1px dashed var(--outline-dash);outline-offset:2px;}
  .text-card.dragging .text-body{cursor:grabbing;}
  .text-card .del{position:absolute;top:-10px;right:-10px;width:20px;height:20px;background:var(--secondary-bg);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:pointer;padding:0;opacity:0;transition:opacity .12s;}
  .text-card:hover .del, .text-card.selected .del{opacity:1;}
  .text-card .del:hover{background:#c0392b;color:#fff;}

  /* Floating formatting toolbar for a selected text layer: size, bold/italic, and
     alignment, applied to the whole layer (not per-character rich text) — simpler
     and matches treating a text layer as a single object, like Figma's text tool. */
  .text-toolbar{position:absolute;left:0;bottom:calc(100% + 16px);display:none;align-items:center;gap:2px;background:var(--card-header);border:1px solid var(--hover-3);border-radius:8px;padding:4px;box-shadow:0 4px 14px var(--shadow);white-space:nowrap;z-index:10;}
  .text-card.selected .text-toolbar{display:flex;}
  .text-toolbar button{background:none;border:none;color:var(--text);font-size:12px;width:24px;height:24px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
  .text-toolbar button:hover{background:var(--hover-3);}
  .text-toolbar button.active{background:var(--accent);color:#000;}
  .text-toolbar .fmt-size-label{font-size:11px;color:var(--muted);min-width:18px;text-align:center;user-select:none;flex-shrink:0;}
  .text-toolbar .fmt-sep{width:1px;height:18px;background:var(--hover-3);margin:0 2px;flex-shrink:0;}
  .text-toolbar .align-bars{display:flex;flex-direction:column;gap:2px;width:14px;}
  .text-toolbar .align-bars span{display:block;height:2px;background:currentColor;border-radius:1px;}
  .text-toolbar button[data-align="left"] .align-bars{align-items:flex-start;}
  .text-toolbar button[data-align="center"] .align-bars{align-items:center;}
  .text-toolbar button[data-align="right"] .align-bars{align-items:flex-end;}
  .text-toolbar .align-bars span:nth-child(1){width:14px;}
  .text-toolbar .align-bars span:nth-child(2){width:9px;}
  .text-toolbar .align-bars span:nth-child(3){width:12px;}

  .empty-state{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;width:380px;}
  .empty-state h2{color:var(--muted2);font-weight:500;font-size:16px;}

  #authPanel{position:fixed;top:64px;right:16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;width:300px;max-width:85vw;z-index:1100;box-shadow:0 8px 24px var(--shadow);display:none;}
  #authPanel.open{display:block;}
  #authPanel label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
  #authPanel input{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:6px;font-size:12px;margin-bottom:10px;}
  #authPanel .redirect{font-size:11px;color:var(--accent);word-break:break-all;background:var(--input-bg);padding:6px 8px;border-radius:6px;margin-bottom:10px;}
  #authPanel button{width:100%;}
  #mobileNote{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.4;}

  #modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000;}
  #modalOverlay.open{display:flex;}
  #modalBox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;width:320px;max-width:88vw;box-shadow:0 12px 32px var(--shadow-strong);}
  #modalBox h4{margin:0 0 10px;font-size:14px;color:var(--text);}
  #modalBox p{margin:0 0 10px;font-size:12px;color:var(--muted);line-height:1.4;}
  #modalBox input{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:14px;}
  #modalBox .row{display:flex;gap:8px;justify-content:flex-end;}
  #modalBox .row button{padding:7px 14px;}
  #modalBox .row button.secondary{background:var(--secondary-bg);color:var(--text);}
  #modalBox .row button.secondary:hover{background:var(--hover-3);}

  #canvasListOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000;}
  #canvasListOverlay.open{display:flex;}
  #canvasListBox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;width:380px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 32px var(--shadow-strong);}
  #canvasListBox h4{margin:0 0 10px;font-size:14px;color:var(--text);}
  #canvasListItems{overflow-y:auto;flex:1;margin-bottom:12px;min-height:40px;}
  .canvas-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px;border-radius:6px;cursor:pointer;}
  .canvas-item:hover{background:var(--hover-1);}
  .canvas-item-main{overflow:hidden;flex:1;}
  .canvas-item-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .canvas-item-date{font-size:11px;color:var(--muted);margin-top:2px;}
  .canvas-item-del{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 7px;border-radius:4px;flex-shrink:0;}
  .canvas-item-del:hover{background:#c0392b;color:#fff;}
  #canvasListBox .row{display:flex;gap:8px;justify-content:flex-end;}
  #canvasListBox .row button{padding:7px 14px;}
</style>
</head>
<body>
<div id="toolbar">
  <input id="urlInput" type="text" placeholder="Paste a Spotify track link…">
  <button id="addBtn">Add song</button>
  <button id="addTextBtn" class="secondary">Add text</button>
  <button id="libraryBtn" class="secondary">Library</button>
  <button id="saveBtn" class="secondary">Save canvas</button>
  <button id="openBtn" class="secondary">Open canvas</button>
  <button id="authBtn" class="secondary">Connect Spotify</button>
  <button id="themeToggleBtn" class="secondary" type="button" title="Toggle light/dark mode">☀ Light</button>
  <span id="status">Not connected</span>
  <div id="hint">Scroll to pan · Ctrl/⌘+scroll or pinch to zoom · Drag a card header to move</div>
</div>

<div id="authPanel">
  <button id="connectBtn">Log in with Spotify</button>
  <div id="mobileNote"></div>
</div>

<div id="modalOverlay">
  <div id="modalBox">
    <h4 id="modalTitle">Name this canvas file</h4>
    <p id="modalMsg" style="display:none;"></p>
    <input id="modalInput" type="text">
    <div class="row">
      <button id="modalCancelBtn" class="secondary">Cancel</button>
      <button id="modalOkBtn">Save</button>
    </div>
  </div>
</div>

<div id="canvasListOverlay">
  <div id="canvasListBox">
    <h4>Your saved canvases</h4>
    <div id="canvasListItems"></div>
    <div class="row">
      <button id="canvasListCloseBtn" class="secondary">Close</button>
    </div>
  </div>
</div>

<div id="sidebar">
  <h3>Load any playlist by link</h3>
  <div id="loadPlaylistRow">
    <input id="playlistUrlInput" type="text" placeholder="Paste a playlist link…">
    <button id="loadPlaylistBtn">Load</button>
  </div>
  <div id="loadedPlaylistMeta"></div>
  <h3>Your Playlists</h3>
  <div id="playlistList"></div>
  <h3 id="tracksHeading" style="display:none;">Tracks</h3>
  <div id="trackList"></div>
</div>

<div id="viewport">
  <div id="canvas">
    <div class="empty-state" id="emptyState">
      <h2>Connect Spotify to drag songs from any playlist — or paste a track link to add a preview card</h2>
    </div>
  </div>
</div>
<div id="zoomControls">
  <button id="zoomOutBtn" type="button" title="Zoom out">−</button>
  <span id="zoomLabel" title="Reset to 100%">100%</span>
  <button id="zoomInBtn" type="button" title="Zoom in">+</button>
</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script>
(function(){
  const STORAGE_KEY = 'spotify-canvas-cards-v2';
  const CLIENT_ID = 'acc2ce9af512491bb94ce2feb0afa027';
  const TOKENS_KEY = 'spc_tokens';
  const THEME_KEY = 'spc_theme';
  let currentTheme = 'dark';
  try{ currentTheme = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){}
  document.documentElement.setAttribute('data-theme', currentTheme);

  const canvas = document.getElementById('canvas');
  const viewport = document.getElementById('viewport');
  const urlInput = document.getElementById('urlInput');
  const addBtn = document.getElementById('addBtn');
  const emptyState = document.getElementById('emptyState');
  const authPanel = document.getElementById('authPanel');
  const authBtn = document.getElementById('authBtn');
  const connectBtn = document.getElementById('connectBtn');
  const statusEl = document.getElementById('status');
  const libraryBtn = document.getElementById('libraryBtn');
  const sidebar = document.getElementById('sidebar');
  const playlistList = document.getElementById('playlistList');
  const trackList = document.getElementById('trackList');
  const tracksHeading = document.getElementById('tracksHeading');
  const playlistUrlInput = document.getElementById('playlistUrlInput');
  const loadPlaylistBtn = document.getElementById('loadPlaylistBtn');
  const loadedPlaylistMeta = document.getElementById('loadedPlaylistMeta');
  const mobileNote = document.getElementById('mobileNote');
  const addTextBtn = document.getElementById('addTextBtn');
  const saveBtn = document.getElementById('saveBtn');
  const openBtn = document.getElementById('openBtn');
  const zoomControls = document.getElementById('zoomControls');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomLabel = document.getElementById('zoomLabel');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalMsg = document.getElementById('modalMsg');
  const modalInput = document.getElementById('modalInput');
  const modalCancelBtn = document.getElementById('modalCancelBtn');
  const modalOkBtn = document.getElementById('modalOkBtn');
  const canvasListOverlay = document.getElementById('canvasListOverlay');
  const canvasListItems = document.getElementById('canvasListItems');
  const canvasListCloseBtn = document.getElementById('canvasListCloseBtn');
  const themeToggleBtn = document.getElementById('themeToggleBtn');

  // Small in-app replacements for window.prompt()/alert(): some embedded/preview
  // browser contexts refuse native dialogs outright, and even where supported
  // they look out of place against the app's own UI, so canvas save/open uses
  // these instead.
  function promptModal(title, defaultValue){
    return new Promise(resolve => {
      modalTitle.textContent = title;
      modalMsg.style.display = 'none';
      modalInput.style.display = '';
      modalInput.value = defaultValue || '';
      modalCancelBtn.style.display = '';
      modalOkBtn.textContent = 'Save';
      modalOverlay.classList.add('open');
      modalInput.focus();
      modalInput.select();
      function cleanup(result){
        modalOverlay.classList.remove('open');
        modalOkBtn.removeEventListener('click', onOk);
        modalCancelBtn.removeEventListener('click', onCancel);
        modalInput.removeEventListener('keydown', onKey);
        resolve(result);
      }
      function onOk(){ cleanup(modalInput.value); }
      function onCancel(){ cleanup(null); }
      function onKey(e){
        if(e.key === 'Enter'){ e.preventDefault(); onOk(); }
        else if(e.key === 'Escape'){ e.preventDefault(); onCancel(); }
      }
      modalOkBtn.addEventListener('click', onOk);
      modalCancelBtn.addEventListener('click', onCancel);
      modalInput.addEventListener('keydown', onKey);
    });
  }
  function alertModal(message){
    return new Promise(resolve => {
      modalTitle.textContent = 'Heads up';
      modalMsg.textContent = message;
      modalMsg.style.display = '';
      modalInput.style.display = 'none';
      modalCancelBtn.style.display = 'none';
      modalOkBtn.textContent = 'OK';
      modalOverlay.classList.add('open');
      modalOkBtn.focus();
      function cleanup(){
        modalOverlay.classList.remove('open');
        modalOkBtn.removeEventListener('click', onOk);
        resolve();
      }
      function onOk(){ cleanup(); }
      modalOkBtn.addEventListener('click', onOk);
    });
  }
  function confirmModal(title, message, okLabel){
    return new Promise(resolve => {
      modalTitle.textContent = title;
      modalMsg.textContent = message;
      modalMsg.style.display = '';
      modalInput.style.display = 'none';
      modalCancelBtn.style.display = '';
      modalOkBtn.textContent = okLabel || 'OK';
      modalOverlay.classList.add('open');
      modalOkBtn.focus();
      function cleanup(result){
        modalOverlay.classList.remove('open');
        modalOkBtn.removeEventListener('click', onOk);
        modalCancelBtn.removeEventListener('click', onCancel);
        resolve(result);
      }
      function onOk(){ cleanup(true); }
      function onCancel(){ cleanup(false); }
      modalOkBtn.addEventListener('click', onOk);
      modalCancelBtn.addEventListener('click', onCancel);
    });
  }

  // Touch / no-hover device detection: Spotify's Web Playback SDK does not run on
  // mobile browsers, and there is no real "hover" on a touchscreen, so those
  // devices fall back to tap-to-play 30s previews via the public embed player.
  const IS_TOUCH = !window.matchMedia('(hover: hover)').matches || navigator.maxTouchPoints > 2;
  mobileNote.textContent = IS_TOUCH
    ? 'This device plays 30-second previews on tap (full in-browser playback only works on desktop browsers — that\'s a Spotify platform limit, not this app).'
    : '';

  const redirectUri = location.origin + location.pathname;

  // ---------- PKCE / OAuth ----------
  function generateRandomString(length){
    const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let text = '';
    const values = crypto.getRandomValues(new Uint8Array(length));
    values.forEach(v => text += possible[v % possible.length]);
    return text;
  }
  function base64urlencode(buf){
    let str = '';
    const bytes = new Uint8Array(buf);
    for(const b of bytes) str += String.fromCharCode(b);
    return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  async function pkceChallenge(){
    const verifier = generateRandomString(64);
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return {verifier, challenge: base64urlencode(digest)};
  }

  function getTokens(){
    try{ return JSON.parse(localStorage.getItem(TOKENS_KEY) || 'null'); }catch(e){ return null; }
  }
  function saveTokens(json){
    const existing = getTokens() || {};
    const tokens = {
      access_token: json.access_token,
      refresh_token: json.refresh_token || existing.refresh_token,
      expires_at: Date.now() + (json.expires_in - 30) * 1000
    };
    localStorage.setItem(TOKENS_KEY, JSON.stringify(tokens));
    return tokens;
  }

  async function login(){
    const {verifier, challenge} = await pkceChallenge();
    sessionStorage.setItem('spc_verifier', verifier);
    const scope = 'streaming user-read-email user-read-private playlist-read-private playlist-read-collaborative user-modify-playback-state user-read-playback-state';
    const params = new URLSearchParams({
      client_id: CLIENT_ID, response_type: 'code', redirect_uri: redirectUri,
      scope, code_challenge_method: 'S256', code_challenge: challenge
    });
    location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
  }

  async function exchangeCode(code){
    const verifier = sessionStorage.getItem('spc_verifier');
    const body = new URLSearchParams({
      client_id: CLIENT_ID, grant_type: 'authorization_code', code,
      redirect_uri: redirectUri, code_verifier: verifier
    });
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body
    });
    const json = await res.json();
    if(json.access_token){ saveTokens(json); history.replaceState({}, '', redirectUri); await afterLogin(); }
    else { console.error(json); alert('Login failed: ' + (json.error_description || json.error)); }
  }

  async function refreshToken(){
    const tokens = getTokens();
    if(!tokens || !tokens.refresh_token) return null;
    const body = new URLSearchParams({
      client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: tokens.refresh_token
    });
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body
    });
    const json = await res.json();
    if(json.access_token) return saveTokens(json);
    return null;
  }

  async function getValidToken(){
    let tokens = getTokens();
    if(!tokens) return null;
    if(Date.now() >= tokens.expires_at){ tokens = await refreshToken(); }
    return tokens ? tokens.access_token : null;
  }

  function isLoggedIn(){ const t = getTokens(); return !!(t && t.refresh_token); }

  let meId = null;
  async function afterLogin(){
    authPanel.classList.remove('open');
    const token = await getValidToken();
    if(!token) return;
    const res = await fetch('https://api.spotify.com/v1/me', {headers:{Authorization:'Bearer '+token}});
    const me = await res.json();
    meId = me.id || null;
    statusEl.textContent = 'Connected as ' + (me.display_name || me.id);
    authBtn.textContent = 'Reconnect';
    loadMyPlaylists();
  }

  // ---------- Web Playback SDK (desktop only) ----------
  let player = null, deviceId = null;
  // Live playback position, tracked from the SDK's state events so full-track cards can
  // show a real, scrubbable progress bar (like the Spotify app) instead of silent hover-play.
  let sdkTrackUri = null, sdkPosition = 0, sdkDuration = 0, sdkPaused = true, sdkLastTick = 0;
  // Which card (by id) last requested playback. Two cards can share the same track uri
  // (a full track and a clip cut from it), so "is this card the one playing" is tracked
  // per-card rather than per-uri.
  let activeCardId = null;
  const transportRenderers = new Set();
  function currentEstimatedPosition(){
    if(sdkPaused) return sdkPosition;
    return Math.min(sdkDuration || Infinity, sdkPosition + (Date.now() - sdkLastTick));
  }
  window.onSpotifyWebPlaybackSDKReady = () => {
    if(!isLoggedIn() || IS_TOUCH) return;
    initPlayer();
  };
  function initPlayer(){
    player = new Spotify.Player({
      name: 'Spotify Canvas',
      getOAuthToken: cb => { getValidToken().then(t => cb(t)); },
      volume: 0.8
    });
    player.addListener('ready', ({device_id}) => { deviceId = device_id; });
    player.addListener('not_ready', () => { deviceId = null; });
    player.addListener('initialization_error', ({message}) => console.error('init error', message));
    player.addListener('authentication_error', ({message}) => console.error('auth error', message));
    player.addListener('account_error', ({message}) => console.error('account error (Premium required)', message));
    player.addListener('player_state_changed', (state) => {
      if(!state) return;
      // The SDK's WebPlaybackState has no top-level `duration` — total track length
      // lives on track_window.current_track.duration_ms instead.
      const currentTrack = state.track_window && state.track_window.current_track;
      sdkPosition = state.position;
      sdkDuration = currentTrack ? currentTrack.duration_ms : 0;
      sdkPaused = state.paused;
      sdkLastTick = Date.now();
      sdkTrackUri = currentTrack ? currentTrack.uri : null;
    });
    player.connect();
    setInterval(() => transportRenderers.forEach(fn => fn()), 250);
  }
  let pauseTimer = null, segmentTimer = null;
  async function playFullTrack(uri, startMs){
    clearTimeout(pauseTimer); clearTimeout(segmentTimer);
    const token = await getValidToken();
    if(!token || !deviceId) return;
    const body = {uris:[uri]};
    if(startMs) body.position_ms = startMs;
    await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
      method:'PUT', headers:{Authorization:'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }).catch(()=>{});
  }
  function schedulePause(){
    clearTimeout(pauseTimer); clearTimeout(segmentTimer);
    pauseTimer = setTimeout(async () => {
      const token = await getValidToken();
      if(!token) return;
      fetch('https://api.spotify.com/v1/me/player/pause', {method:'PUT', headers:{Authorization:'Bearer '+token}}).catch(()=>{});
    }, 150);
  }
  function pauseNow(){
    clearTimeout(pauseTimer); clearTimeout(segmentTimer);
    getValidToken().then(token => { if(token) fetch('https://api.spotify.com/v1/me/player/pause', {method:'PUT', headers:{Authorization:'Bearer '+token}}).catch(()=>{}); });
  }

  // Play button + scrubbable timeline for an SDK-backed card. Used for both full (un-clipped)
  // tracks and already-extracted clip cards — for a clip, `clipRange` scopes the timeline to
  // just that segment (0:00 shows as clipRange.clipStart, and playback auto-pauses at the end).
  function wireTransport(el, id, uri, knownDuration, clipRange){
    const playBtn = el.querySelector('.playBtn');
    const seekbar = el.querySelector('.seekbar');
    const seekfill = el.querySelector('.seekfill');
    const seekhandle = el.querySelector('.seekhandle');
    const timeLabel = el.querySelector('.timeLabel');
    const clipStartInput = el.querySelector('.clipStartInput');
    const clipEndInput = el.querySelector('.clipEndInput');
    const setStartBtn = el.querySelector('.setStartBtn');
    const setEndBtn = el.querySelector('.setEndBtn');
    let scrubbing = false;

    // "Active" means THIS card is the one currently driving playback — tracked per-card
    // (not just per-uri) so a clip and its source full track don't fight over one indicator.
    function isActiveTrack(){ return activeCardId === id; }
    function totalMs(){ return clipRange ? (clipRange.clipEnd - clipRange.clipStart) : (knownDuration || (isActiveTrack() ? sdkDuration : 0) || 0); }

    function render(){
      if(scrubbing) return;
      const active = isActiveTrack();
      let pos = 0;
      if(active){
        const raw = currentEstimatedPosition();
        pos = clipRange ? Math.max(0, raw - clipRange.clipStart) : raw;
      }
      const dur = totalMs();
      const pct = dur ? Math.min(100, (pos / dur) * 100) : 0;
      seekfill.style.width = pct + '%';
      seekhandle.style.left = pct + '%';
      timeLabel.textContent = formatTime(pos) + ' / ' + formatTime(dur);
      playBtn.textContent = (active && !sdkPaused) ? '⏸' : '▶';
      el.classList.toggle('playing', active && !sdkPaused);
    }
    render();
    transportRenderers.add(render);

    function armAutoPause(remainingMs){
      clearTimeout(segmentTimer);
      if(clipRange) segmentTimer = setTimeout(() => { pauseNow(); render(); }, Math.max(0, remainingMs));
    }

    playBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const token = await getValidToken();
      if(!token) return;
      if(isActiveTrack() && !sdkPaused){
        await fetch('https://api.spotify.com/v1/me/player/pause', {method:'PUT', headers:{Authorization:'Bearer '+token}}).catch(()=>{});
        sdkPaused = true; sdkLastTick = Date.now();
        clearTimeout(segmentTimer);
      } else if(isActiveTrack() && sdkPaused){
        await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {method:'PUT', headers:{Authorization:'Bearer '+token}}).catch(()=>{});
        sdkPaused = false; sdkLastTick = Date.now();
        if(clipRange) armAutoPause(clipRange.clipEnd - currentEstimatedPosition());
      } else {
        activeCardId = id;
        const startAt = clipRange ? clipRange.clipStart : 0;
        await playFullTrack(uri, startAt);
        sdkTrackUri = uri; sdkPosition = startAt; sdkDuration = knownDuration || sdkDuration; sdkPaused = false; sdkLastTick = Date.now();
        if(clipRange) armAutoPause(clipRange.clipEnd - clipRange.clipStart);
      }
      render();
    });

    function msFromClientX(clientX){
      const rect = seekbar.getBoundingClientRect();
      const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      return Math.floor(pct * totalMs());
    }

    async function seekTo(localMs){
      const token = await getValidToken();
      if(!token) return;
      const absoluteMs = clipRange ? clipRange.clipStart + localMs : localMs;
      activeCardId = id;
      if(sdkTrackUri === uri && deviceId){
        await fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${absoluteMs}&device_id=${deviceId}`, {method:'PUT', headers:{Authorization:'Bearer '+token}}).catch(()=>{});
        sdkPosition = absoluteMs; sdkLastTick = Date.now(); sdkPaused = false;
      } else {
        await playFullTrack(uri, absoluteMs);
        sdkTrackUri = uri; sdkPosition = absoluteMs; sdkDuration = knownDuration || sdkDuration; sdkPaused = false; sdkLastTick = Date.now();
      }
      if(clipRange) armAutoPause(clipRange.clipEnd - absoluteMs);
      render();
    }

    seekbar.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      scrubbing = true;
      const ms = msFromClientX(e.clientX);
      const pct = totalMs() ? Math.min(100, (ms/totalMs())*100) : 0;
      seekfill.style.width = pct+'%'; seekhandle.style.left = pct+'%';
      timeLabel.textContent = formatTime(ms) + ' / ' + formatTime(totalMs());
    });
    document.addEventListener('mousemove', (e) => {
      if(!scrubbing) return;
      const ms = msFromClientX(e.clientX);
      const pct = totalMs() ? Math.min(100, (ms/totalMs())*100) : 0;
      seekfill.style.width = pct+'%'; seekhandle.style.left = pct+'%';
      timeLabel.textContent = formatTime(ms) + ' / ' + formatTime(totalMs());
    });
    document.addEventListener('mouseup', (e) => {
      if(!scrubbing) return;
      scrubbing = false;
      seekTo(msFromClientX(e.clientX));
    });

    if(setStartBtn) setStartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const ms = isActiveTrack() ? currentEstimatedPosition() : 0;
      clipStartInput.value = formatTime(ms);
    });
    if(setEndBtn) setEndBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const ms = isActiveTrack() ? currentEstimatedPosition() : 0;
      clipEndInput.value = formatTime(ms);
    });
  }

  // Click a sidebar playlist row to preview-play it in place, without placing a card
  // on the canvas; click the same row again to pause. Desktop reuses the same Spotify
  // Connect (Web Playback SDK) full-track playback the cards use. Touch/non-SDK falls
  // back to the 30-second embed preview, sharing ONE hidden controller across every
  // row (switched between tracks with loadUri) instead of an iframe per row.
  let sidebarPreviewController = null, sidebarPreviewMount = null;
  let sidebarPreviewUri = null, sidebarPreviewPlaying = false;
  const sidebarPreviewRenderers = new Set();
  function withSidebarPreviewController(uri, cb){
    if(sidebarPreviewController){
      if(sidebarPreviewUri !== uri){ sidebarPreviewUri = uri; sidebarPreviewPlaying = false; sidebarPreviewController.loadUri(uri); }
      cb(sidebarPreviewController);
      return;
    }
    if(!sidebarPreviewMount){
      sidebarPreviewMount = document.createElement('div');
      sidebarPreviewMount.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;';
      document.body.appendChild(sidebarPreviewMount);
    }
    const create = () => {
      IFrameAPI.createController(sidebarPreviewMount, {uri, width:'1', height:'1'}, (c) => {
        sidebarPreviewController = c;
        sidebarPreviewUri = uri;
        c.addListener('playback_update', e => {
          sidebarPreviewPlaying = !!(e && e.data && e.data.isPaused === false);
          sidebarPreviewRenderers.forEach(fn => fn());
        });
        cb(c);
      });
    };
    if(IFrameAPI) create(); else pendingEmbeds.push({fn: create});
  }

  function wireTrackPreview(el, trackData){
    const previewId = 'preview:' + trackData.uri;
    const useSdk = trackData.full; // already means "!IS_TOUCH" at the point trackData is built
    function isPlaying(){
      return useSdk ? (activeCardId === previewId && !sdkPaused)
                     : (sidebarPreviewUri === trackData.uri && sidebarPreviewPlaying);
    }
    function render(){ el.classList.toggle('playing', isPlaying()); }
    render();
    if(useSdk) transportRenderers.add(render); else sidebarPreviewRenderers.add(render);

    el.addEventListener('click', async (e) => {
      if(e.target.closest('.tapadd')) return;
      if(useSdk){
        const token = await getValidToken();
        if(!token) return;
        if(isPlaying()){
          await fetch('https://api.spotify.com/v1/me/player/pause', {method:'PUT', headers:{Authorization:'Bearer '+token}}).catch(()=>{});
          sdkPaused = true; sdkLastTick = Date.now();
        } else if(activeCardId === previewId && sdkPaused){
          await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {method:'PUT', headers:{Authorization:'Bearer '+token}}).catch(()=>{});
          sdkPaused = false; sdkLastTick = Date.now();
        } else {
          activeCardId = previewId;
          await playFullTrack(trackData.uri, 0);
          sdkTrackUri = trackData.uri; sdkPosition = 0; sdkDuration = trackData.duration || 0; sdkPaused = false; sdkLastTick = Date.now();
        }
        transportRenderers.forEach(fn => fn());
      } else {
        withSidebarPreviewController(trackData.uri, (c) => {
          if(isPlaying()){ c.pause(); sidebarPreviewPlaying = false; }
          else { c.resume(); sidebarPreviewPlaying = true; }
          sidebarPreviewRenderers.forEach(fn => fn());
        });
      }
    });
  }

  // ---------- Helpers ----------
  function trackIdFromUri(uri){ return (uri||'').split(':').pop(); }
  function parseTime(str){
    if(!str) return 0;
    const parts = str.trim().split(':').map(Number);
    if(parts.some(isNaN)) return 0;
    if(parts.length === 2) return (parts[0]*60 + parts[1]) * 1000;
    return (parts[0]||0) * 1000;
  }
  function formatTime(ms){
    const s = Math.round(ms/1000);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  // ---------- Library / playlists sidebar ----------
  async function loadMyPlaylists(){
    const token = await getValidToken();
    if(!token) return;
    const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {headers:{Authorization:'Bearer '+token}});
    const json = await res.json();
    playlistList.innerHTML = '';
    (json.items || []).forEach(pl => {
      const el = document.createElement('div');
      el.className = 'pl-item';
      el.textContent = pl.name;
      el.addEventListener('click', () => {
        document.querySelectorAll('.pl-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        loadedPlaylistMeta.textContent = '';
        loadPlaylistTracks(pl.id);
      });
      playlistList.appendChild(el);
    });
  }

  function extractPlaylistId(input){
    input = (input||'').trim();
    const m = input.match(/playlist[\/:]([a-zA-Z0-9]+)/);
    return m ? m[1].split('?')[0] : null;
  }

  loadPlaylistBtn.addEventListener('click', async () => {
    const id = extractPlaylistId(playlistUrlInput.value);
    if(!id){ playlistUrlInput.style.borderColor = '#c0392b'; setTimeout(()=>playlistUrlInput.style.borderColor='#333',800); return; }
    document.querySelectorAll('.pl-item').forEach(x => x.classList.remove('active'));
    const token = await getValidToken();
    if(token){
      try{
        const res = await fetch(`https://api.spotify.com/v1/playlists/${id}?fields=name,owner.display_name`, {headers:{Authorization:'Bearer '+token}});
        const meta = await res.json();
        if(meta && meta.name){
          loadedPlaylistMeta.textContent = `"${meta.name}" by ${meta.owner ? meta.owner.display_name : 'unknown'}`;
        }
      }catch(e){}
    }
    loadPlaylistTracks(id);
  });
  playlistUrlInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') loadPlaylistBtn.click(); });

  async function loadPlaylistTracks(playlistId){
    tracksHeading.style.display = 'block';
    trackList.innerHTML = '<div style="color:#888;font-size:12px;padding:6px;">Loading…</div>';
    const token = await getValidToken();
    if(!token) return;
    // As of Spotify's Feb 2026 API migration, a playlist's track content lives under an
    // "items" paging object (items.items[].item) — the old "tracks"/"track" names from
    // before that migration were renamed. On top of that, Spotify now only returns that
    // content for playlists the connected account owns or collaborates on; a playlist the
    // account merely follows (created by someone else) comes back with the items field
    // simply absent (200 OK, no error) rather than a helpful error, which is why this also
    // checks the playlist owner against the connected account instead of just trusting an
    // empty result.
    const fields = encodeURIComponent('owner.id,items.items(item(uri,name,artists.name,album.images,duration_ms)),items.next,items.total');
    let all = [];
    let url = `https://api.spotify.com/v1/playlists/${playlistId}?fields=${fields}`;
    let firstPage = true;
    let ownerId = null;
    try{
      while(url && all.length < 300){
        const res = await fetch(url, {headers:{Authorization:'Bearer '+token}});
        if(!res.ok){
          if(firstPage){ trackList.innerHTML = '<div style="color:#c0392b;font-size:12px;padding:6px;">Could not load this playlist (it may be private).</div>'; return; }
          break; // a later page failed to load — keep whatever tracks we already have
        }
        const json = await res.json();
        if(firstPage) ownerId = (json.owner && json.owner.id) || null;
        // The first request nests the paging object under "items"; the "next" link it
        // returns points straight at a paging object with items/next at the top level.
        const block = firstPage ? (json.items || {}) : json;
        all = all.concat(block.items || []);
        url = block.next || null;
        firstPage = false;
      }
    }catch(e){ if(!all.length){ trackList.innerHTML = '<div style="color:#c0392b;font-size:12px;padding:6px;">Could not load this playlist.</div>'; return; } }
    trackList.innerHTML = '';
    if(!all.length){
      if(ownerId && meId && ownerId !== meId){
        trackList.innerHTML = '<div style="color:#c0392b;font-size:12px;padding:6px;line-height:1.4;">Spotify only lets apps read the songs in playlists you created or collaborate on. This one belongs to another account, so its tracks can\'t be loaded here — ask the owner to add you as a collaborator, or save your own copy of it in Spotify and load that copy instead.</div>';
      } else {
        trackList.innerHTML = '<div style="color:#888;font-size:12px;padding:6px;">No tracks found.</div>';
      }
      return;
    }
    all.forEach(wrapper => {
      const tr = wrapper.item;
      if(!tr) return;
      const art = (tr.album && tr.album.images && tr.album.images.length) ? tr.album.images[tr.album.images.length-1].url : '';
      const artists = (tr.artists || []).map(a=>a.name).join(', ');
      const trackData = { uri: tr.uri, name: tr.name, artist: artists, art, full: !IS_TOUCH, duration: tr.duration_ms };
      const el = document.createElement('div');
      el.className = 'track-item';
      el.draggable = !IS_TOUCH;
      el.innerHTML = `<img src="${art}" onerror="this.style.visibility='hidden'"><div class="meta"><div class="t">${tr.name}</div><div class="a">${artists}</div></div>${IS_TOUCH ? '<button class="tapadd">Add</button>' : ''}`;
      if(!IS_TOUCH){
        el.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('application/json', JSON.stringify(trackData));
        });
      } else {
        el.querySelector('.tapadd').addEventListener('click', (e) => {
          e.stopPropagation();
          const center = viewportCenterToCanvas();
          const x = center.x - 115 + (Math.random()*60-30);
          const y = center.y - 40 + (Math.random()*60-30);
          addCardFromData(trackData, x, y);
          sidebar.classList.remove('open');
          viewport.classList.remove('shifted');
        });
      }
      wireTrackPreview(el, trackData);
      trackList.appendChild(el);
    });
  }

  // ---------- Canvas / cards ----------
  let cards = {};
  let idCounter = 0;

  // ---------- Camera (pan + zoom, Figma-style) ----------
  // The canvas is panned/zoomed with a CSS transform rather than native scrolling, so
  // zooming can stay anchored under the cursor exactly like a real design-tool canvas.
  let camX = 0, camY = 0, camZoom = 1;
  const MIN_ZOOM = 0.15, MAX_ZOOM = 3;
  function applyTransform(){
    canvas.style.transform = `translate(${camX}px, ${camY}px) scale(${camZoom})`;
    zoomLabel.textContent = Math.round(camZoom * 100) + '%';
  }
  // Zoom while keeping the canvas point under (clientX, clientY) fixed on screen.
  function zoomAt(clientX, clientY, newZoom){
    newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
    const rect = viewport.getBoundingClientRect();
    const cx = clientX - rect.left, cy = clientY - rect.top;
    const ratio = newZoom / camZoom;
    camX = cx - (cx - camX) * ratio;
    camY = cy - (cy - camY) * ratio;
    camZoom = newZoom;
    applyTransform();
  }
  function zoomAtCenter(newZoom){
    const rect = viewport.getBoundingClientRect();
    zoomAt(rect.left + rect.width/2, rect.top + rect.height/2, newZoom);
  }
  // Canvas-local coordinates of the middle of the visible viewport — used to drop new
  // cards where you're actually looking, regardless of current pan/zoom.
  function viewportCenterToCanvas(){
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    return { x: (vw/2 - camX) / camZoom, y: (vh/2 - camY) / camZoom };
  }

  function serializeCards(){
    return Object.values(cards).map(c => c.type === 'text'
      ? {id:c.id, type:'text', text:c.text, x:c.x, y:c.y, fontSize:c.fontSize, bold:c.bold, italic:c.italic, align:c.align}
      : {id:c.id, uri:c.uri, x:c.x, y:c.y, name:c.name, artist:c.artist, art:c.art, full:c.full, clipStart:c.clipStart, clipEnd:c.clipEnd, duration:c.duration});
  }
  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeCards()));
    }catch(e){}
  }
  function loadState(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ return []; }
  }

  function clearCanvas(){
    Object.values(cards).forEach(c => c.el.remove());
    cards = {};
    idCounter = 0;
  }

  // Shared drag-by-header wiring for every card kind (song cards and text cards alike).
  // Screen-space mouse deltas are converted to canvas-local coordinates by dividing by
  // the current zoom level, since card positions are stored in unscaled canvas space.
  function wireDrag(el, header, id){
    let dragging = false, offX = 0, offY = 0;
    function dragStart(clientX, clientY, target){
      if(target.classList.contains('del') || target.classList.contains('clipBtn')) return false;
      dragging = true;
      const rect = el.getBoundingClientRect();
      offX = (clientX - rect.left) / camZoom; offY = (clientY - rect.top) / camZoom;
      return true;
    }
    function dragMove(clientX, clientY){
      if(!dragging) return;
      const canvasRect = canvas.getBoundingClientRect();
      let nx = Math.max(0, (clientX - canvasRect.left) / camZoom - offX);
      let ny = Math.max(0, (clientY - canvasRect.top) / camZoom - offY);
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
      if(cards[id]){ cards[id].x = nx; cards[id].y = ny; }
    }
    function dragEnd(){ if(dragging){ dragging = false; saveState(); } }
    header.addEventListener('mousedown', (e) => { if(dragStart(e.clientX, e.clientY, e.target)) e.preventDefault(); });
    document.addEventListener('mousemove', (e) => dragMove(e.clientX, e.clientY));
    document.addEventListener('mouseup', dragEnd);
    header.addEventListener('touchstart', (e) => { const t = e.touches[0]; dragStart(t.clientX, t.clientY, e.target); }, {passive:true});
    document.addEventListener('touchmove', (e) => { if(dragging){ const t = e.touches[0]; dragMove(t.clientX, t.clientY); } }, {passive:true});
    document.addEventListener('touchend', dragEnd);
  }

  function extractTrackUri(input){
    input = (input || '').trim();
    let m = input.match(/track[\/:]([a-zA-Z0-9]{10,})/);
    if(m) return 'spotify:track:' + m[1].split('?')[0];
    return null;
  }

  let IFrameAPI = null, pendingEmbeds = [];
  window.onSpotifyIframeApiReady = (api) => {
    IFrameAPI = api;
    pendingEmbeds.forEach(p => p.fn());
    pendingEmbeds = [];
  };

  // Shared selection state for text layers: only one can be "selected" (dashed outline +
  // visible delete button) at a time, matching a single-selection canvas tool like Figma.
  let selectedTextId = null;
  function deselectText(){
    if(selectedTextId && cards[selectedTextId]){
      const prevEl = cards[selectedTextId].el;
      prevEl.classList.remove('selected');
      const prevBody = prevEl.querySelector('.text-body');
      if(prevBody && document.activeElement === prevBody) prevBody.blur();
    }
    selectedTextId = null;
  }
  // Clicking anywhere outside the currently-selected text layer deselects it.
  document.addEventListener('mousedown', (e) => {
    if(selectedTextId && cards[selectedTextId] && !cards[selectedTextId].el.contains(e.target)) deselectText();
  });
  document.addEventListener('touchstart', (e) => {
    if(selectedTextId && cards[selectedTextId] && !cards[selectedTextId].el.contains(e.target)) deselectText();
  }, {passive:true});

  function makeTextCard(id, data, x, y, autoFocus){
    const el = document.createElement('div');
    el.className = 'card text-card';
    el.dataset.id = id;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = `<div class="text-toolbar">
        <button class="fmt-size-dec" type="button" title="Smaller">−</button>
        <span class="fmt-size-label">14</span>
        <button class="fmt-size-inc" type="button" title="Larger">+</button>
        <span class="fmt-sep"></span>
        <button class="fmt-bold" type="button" title="Bold"><b>B</b></button>
        <button class="fmt-italic" type="button" title="Italic"><i>I</i></button>
        <span class="fmt-sep"></span>
        <button class="fmt-align" type="button" data-align="left" title="Align left"><span class="align-bars"><span></span><span></span><span></span></span></button>
        <button class="fmt-align" type="button" data-align="center" title="Align center"><span class="align-bars"><span></span><span></span><span></span></span></button>
        <button class="fmt-align" type="button" data-align="right" title="Align right"><span class="align-bars"><span></span><span></span><span></span></span></button>
      </div>
      <button class="del" title="Remove">✕</button>
      <div class="text-body" contenteditable="true" spellcheck="false"></div>`;
    canvas.appendChild(el);
    emptyState.style.display = 'none';

    const body = el.querySelector('.text-body');
    const delBtn = el.querySelector('.del');
    const toolbar = el.querySelector('.text-toolbar');
    const sizeLabel = el.querySelector('.fmt-size-label');
    const sizeDecBtn = el.querySelector('.fmt-size-dec');
    const sizeIncBtn = el.querySelector('.fmt-size-inc');
    const boldBtn = el.querySelector('.fmt-bold');
    const italicBtn = el.querySelector('.fmt-italic');
    const alignBtns = el.querySelectorAll('.fmt-align');
    body.textContent = data.text || '';

    // Per-layer text formatting (applies to the whole layer, not per-character rich
    // text — simpler and predictable, and matches treating a text layer as one object).
    const fmt = {
      fontSize: data.fontSize || 14,
      bold: !!data.bold,
      italic: !!data.italic,
      align: data.align || 'left'
    };
    cards[id] = {id, el, type:'text', text: data.text || '', x, y, fontSize: fmt.fontSize, bold: fmt.bold, italic: fmt.italic, align: fmt.align};

    function applyFormatting(){
      body.style.fontSize = fmt.fontSize + 'px';
      body.style.fontWeight = fmt.bold ? '700' : '400';
      body.style.fontStyle = fmt.italic ? 'italic' : 'normal';
      body.style.textAlign = fmt.align;
      sizeLabel.textContent = fmt.fontSize;
      boldBtn.classList.toggle('active', fmt.bold);
      italicBtn.classList.toggle('active', fmt.italic);
      alignBtns.forEach(b => b.classList.toggle('active', b.dataset.align === fmt.align));
      if(cards[id]){ cards[id].fontSize = fmt.fontSize; cards[id].bold = fmt.bold; cards[id].italic = fmt.italic; cards[id].align = fmt.align; }
    }
    applyFormatting();

    // Toolbar interactions: keep the contenteditable's focus/selection intact (so
    // formatting can be applied mid-edit) and never let clicks here bubble into the
    // document-level click-outside-to-deselect listener or the card's own drag wiring.
    toolbar.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); });
    sizeDecBtn.addEventListener('click', (e) => { e.stopPropagation(); fmt.fontSize = Math.max(10, fmt.fontSize - 2); applyFormatting(); saveState(); });
    sizeIncBtn.addEventListener('click', (e) => { e.stopPropagation(); fmt.fontSize = Math.min(96, fmt.fontSize + 2); applyFormatting(); saveState(); });
    boldBtn.addEventListener('click', (e) => { e.stopPropagation(); fmt.bold = !fmt.bold; applyFormatting(); saveState(); });
    italicBtn.addEventListener('click', (e) => { e.stopPropagation(); fmt.italic = !fmt.italic; applyFormatting(); saveState(); });
    alignBtns.forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); fmt.align = b.dataset.align; applyFormatting(); saveState(); }));

    function select(){
      if(selectedTextId !== id) deselectText();
      selectedTextId = id;
      el.classList.add('selected');
    }
    // Place the text cursor at a specific screen point, for a natural "click to edit
    // right where you clicked" feel rather than always landing at the start/end.
    function focusAt(clientX, clientY){
      body.focus();
      let range = null;
      if(document.caretRangeFromPoint) range = document.caretRangeFromPoint(clientX, clientY);
      else if(document.caretPositionFromPoint){
        const pos = document.caretPositionFromPoint(clientX, clientY);
        if(pos){ range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); }
      }
      if(range){ const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); }
    }

    // Click-to-select / click-again-to-edit / drag-to-move, all disambiguated by mouse
    // movement — the same gesture vocabulary a real canvas tool uses for text layers,
    // rather than a fixed drag handle around a card.
    let dragging = false, dragStarted = false, startX = 0, startY = 0, offX = 0, offY = 0;
    body.addEventListener('mousedown', (e) => {
      if(document.activeElement === body) return; // already editing — let native caret/selection work normally
      e.preventDefault();
      e.stopPropagation();
      dragging = true; dragStarted = false;
      startX = e.clientX; startY = e.clientY;
      const rect = el.getBoundingClientRect();
      offX = (e.clientX - rect.left) / camZoom; offY = (e.clientY - rect.top) / camZoom;
    });
    document.addEventListener('mousemove', (e) => {
      if(!dragging) return;
      if(!dragStarted && Math.hypot(e.clientX - startX, e.clientY - startY) > 4){ dragStarted = true; select(); el.classList.add('dragging'); }
      if(dragStarted){
        const canvasRect = canvas.getBoundingClientRect();
        const nx = Math.max(0, (e.clientX - canvasRect.left) / camZoom - offX);
        const ny = Math.max(0, (e.clientY - canvasRect.top) / camZoom - offY);
        el.style.left = nx + 'px'; el.style.top = ny + 'px';
        if(cards[id]){ cards[id].x = nx; cards[id].y = ny; }
      }
    });
    document.addEventListener('mouseup', (e) => {
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if(dragStarted){ saveState(); }
      else if(selectedTextId === id){ focusAt(e.clientX, e.clientY); }
      else { select(); }
    });

    // Touch: mirrors the mouse gesture (tap to select, tap again to edit, drag to move),
    // but without preventDefault so a plain tap can still fall through to the browser's
    // own tap-to-focus keyboard behavior — simpler is better on a touch keyboard.
    let touchDragging = false, touchDragStarted = false, tStartX = 0, tStartY = 0, tOffX = 0, tOffY = 0;
    body.addEventListener('touchstart', (e) => {
      if(document.activeElement === body) return;
      const t = e.touches[0];
      touchDragging = true; touchDragStarted = false;
      tStartX = t.clientX; tStartY = t.clientY;
      const rect = el.getBoundingClientRect();
      tOffX = (t.clientX - rect.left) / camZoom; tOffY = (t.clientY - rect.top) / camZoom;
    }, {passive:true});
    document.addEventListener('touchmove', (e) => {
      if(!touchDragging) return;
      const t = e.touches[0];
      if(!touchDragStarted && Math.hypot(t.clientX - tStartX, t.clientY - tStartY) > 6){ touchDragStarted = true; select(); el.classList.add('dragging'); }
      if(touchDragStarted){
        const canvasRect = canvas.getBoundingClientRect();
        const nx = Math.max(0, (t.clientX - canvasRect.left) / camZoom - tOffX);
        const ny = Math.max(0, (t.clientY - canvasRect.top) / camZoom - tOffY);
        el.style.left = nx + 'px'; el.style.top = ny + 'px';
        if(cards[id]){ cards[id].x = nx; cards[id].y = ny; }
      }
    }, {passive:true});
    document.addEventListener('touchend', () => {
      if(!touchDragging) return;
      touchDragging = false;
      el.classList.remove('dragging');
      if(touchDragStarted){ saveState(); }
      else if(selectedTextId !== id){ select(); }
    });

    body.addEventListener('input', () => {
      // innerText (not textContent) so line breaks typed with Enter survive a save/reload —
      // contenteditable represents them as <div>/<br> boundaries, which only innerText reflects.
      if(cards[id]) cards[id].text = body.innerText;
      saveState();
    });

    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(selectedTextId === id) selectedTextId = null;
      el.remove(); delete cards[id]; saveState();
      if(Object.keys(cards).length === 0) emptyState.style.display = 'block';
    });

    if(autoFocus){ select(); body.focus(); }
  }

  function makeCard(id, data, x, y, autoFocus){
    if(data.type === 'text') return makeTextCard(id, data, x, y, autoFocus);
    const {uri, name, artist, art, full, clipStart, clipEnd, duration} = data;
    const useSdk = full && !IS_TOUCH;
    const isClip = clipStart != null && clipEnd != null && clipEnd > clipStart;
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = id;
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    let tagLabel = useSdk ? 'full track' : 'preview';
    if(isClip) tagLabel = formatTime(clipStart) + '–' + formatTime(clipEnd);

    let bodyHtml;
    if(useSdk){
      bodyHtml = `<div class="full-card">
        <img src="${art||''}" onerror="this.style.visibility='hidden'">
        <div class="meta">
          <div class="t">${name||'Unknown track'}</div>
          <div class="a">${artist||''}</div>
        </div>
      </div>`;
      // Every SDK-backed card — full track or already-extracted clip — gets a real play
      // button + scrubbable timeline (like the Spotify app). For a clip the timeline is
      // scoped to just that segment, so "0:00" is the clip's start, not the song's.
      const transportTotal = isClip ? (clipEnd - clipStart) : (duration||0);
      bodyHtml += `<div class="transport">
        <button class="playBtn" type="button">▶</button>
        <div class="seekbar"><div class="seekfill"></div><div class="seekhandle"></div></div>
        <span class="timeLabel">0:00 / ${formatTime(transportTotal)}</span>
      </div>`;
    } else {
      bodyHtml = `<div class="embed-wrap">loading…</div>`;
    }

    const clipEditorHtml = !isClip ? `<div class="clip-editor">
        <div class="timerow">
          <label>Start</label><input class="clipStartInput" type="text" placeholder="0:00" value="">
          ${useSdk ? '<button class="setBtn setStartBtn" type="button">Set from here</button>' : ''}
        </div>
        <div class="timerow">
          <label>End</label><input class="clipEndInput" type="text" placeholder="0:30" value="">
          ${useSdk ? '<button class="setBtn setEndBtn" type="button">Set from here</button>' : ''}
        </div>
        <button class="makeClipBtn">Create clip card</button>
      </div>` : '';

    el.innerHTML = `<div class="card-header">
        <span class="tag">${tagLabel}</span>
        <div class="btns">
          ${!isClip ? '<button class="clipBtn" title="Make a clip from this">✂</button>' : ''}
          <button class="del" title="Remove">✕</button>
        </div>
      </div>${bodyHtml}${clipEditorHtml}`;
    canvas.appendChild(el);
    emptyState.style.display = 'none';

    wireDrag(el, el.querySelector('.card-header'), id);

    el.querySelector('.del').addEventListener('click', () => {
      el.remove(); delete cards[id]; saveState();
      if(Object.keys(cards).length === 0) emptyState.style.display = 'block';
    });

    if(!isClip){
      const clipEditor = el.querySelector('.clip-editor');
      el.querySelector('.clipBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        clipEditor.classList.toggle('open');
      });
      el.querySelector('.makeClipBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const sMs = parseTime(el.querySelector('.clipStartInput').value);
        const eMs = parseTime(el.querySelector('.clipEndInput').value);
        if(eMs <= sMs){ alert('Set an end point after the start point (scrub the bar and hit "Set from here" on each, or type a time).'); return; }
        addCardFromData({uri, name, artist, art, full, clipStart: sMs, clipEnd: eMs, duration}, x + 30, y + 30);
        clipEditor.classList.remove('open');
      });
    }

    // ---- Playback wiring ----
    if(useSdk){
      // Real play button + scrubbable timeline, for both full tracks and extracted clips
      // (a clip's timeline is scoped to its own start/end and auto-pauses at the end).
      wireTransport(el, id, uri, duration, isClip ? {clipStart, clipEnd} : null);
    } else {
      // Embed-based playback (preview cards, and all cards on touch devices)
      const trackId = trackIdFromUri(uri);
      let controller = null, playing = false, segTimer = null;
      const embedReady = () => {
        const wrap = el.querySelector('.embed-wrap');
        if(!wrap) return;
        wrap.textContent = '';
        IFrameAPI.createController(wrap, {uri, width:'100%', height: IS_TOUCH ? '80' : '80'}, (c) => {
          controller = c;
          controller.addListener('playback_update', e => {
            if(e && e.data && e.data.isPaused === false) el.classList.add('playing');
          });
        });
      };
      if(IFrameAPI) embedReady(); else pendingEmbeds.push({fn: embedReady});

      function startEmbed(){
        if(!controller) return;
        clearTimeout(segTimer);
        if(isClip){
          controller.seek(Math.floor(clipStart/1000));
          controller.resume();
          segTimer = setTimeout(() => { controller.pause(); el.classList.remove('playing'); playing = false; }, clipEnd - clipStart);
        } else {
          controller.resume();
        }
        playing = true;
        el.classList.add('playing');
      }
      function stopEmbed(){
        if(!controller) return;
        clearTimeout(segTimer);
        controller.pause();
        playing = false;
        el.classList.remove('playing');
      }
      if(!IS_TOUCH){
        el.addEventListener('mouseenter', startEmbed);
        el.addEventListener('mouseleave', stopEmbed);
      } else {
        el.addEventListener('click', (e) => {
          if(e.target.closest('.card-header') || e.target.closest('.clip-editor')) return;
          if(playing) stopEmbed(); else startEmbed();
        });
      }
    }

    cards[id] = {id, el, uri, name, artist, art, full, clipStart, clipEnd, duration, x, y};
  }

  function addCardFromData(data, x, y, autoFocus){
    const id = 'c' + (++idCounter) + '_' + Date.now();
    makeCard(id, data, x, y, autoFocus);
    saveState();
  }

  addBtn.addEventListener('click', () => {
    const uri = extractTrackUri(urlInput.value);
    if(!uri){ urlInput.style.borderColor = '#c0392b'; setTimeout(()=>urlInput.style.borderColor='#333',800); return; }
    const center = viewportCenterToCanvas();
    addCardFromData({uri, full:false}, center.x - 115, center.y - 40);
    urlInput.value = '';
  });
  urlInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') addBtn.click(); });

  addTextBtn.addEventListener('click', () => {
    const center = viewportCenterToCanvas();
    addCardFromData({type:'text', text:''}, center.x - 115, center.y - 40, true);
  });

  canvas.addEventListener('dragover', (e) => e.preventDefault());
  canvas.addEventListener('drop', (e) => {
    e.preventDefault();
    const raw = e.dataTransfer.getData('application/json');
    if(!raw) return;
    const data = JSON.parse(raw);
    const canvasRect = canvas.getBoundingClientRect();
    const x = (e.clientX - canvasRect.left) / camZoom - 110, y = (e.clientY - canvasRect.top) / camZoom - 30;
    addCardFromData(data, Math.max(0,x), Math.max(0,y));
  });

  // ---------- Pan (mouse + touch) ----------
  let panning = false, panStartX=0, panStartY=0, camStartX=0, camStartY=0;
  function panStart(target, clientX, clientY){
    if(target !== viewport && target !== canvas && target !== emptyState) return;
    panning = true; viewport.classList.add('panning');
    panStartX = clientX; panStartY = clientY;
    camStartX = camX; camStartY = camY;
  }
  function panMove(clientX, clientY){
    if(!panning) return;
    camX = camStartX + (clientX - panStartX);
    camY = camStartY + (clientY - panStartY);
    applyTransform();
  }
  function panEnd(){ panning = false; viewport.classList.remove('panning'); }
  viewport.addEventListener('mousedown', (e) => panStart(e.target, e.clientX, e.clientY));
  document.addEventListener('mousemove', (e) => panMove(e.clientX, e.clientY));
  document.addEventListener('mouseup', panEnd);
  viewport.addEventListener('touchstart', (e) => { const t = e.touches[0]; panStart(e.target, t.clientX, t.clientY); }, {passive:true});
  document.addEventListener('touchmove', (e) => { if(panning){ const t = e.touches[0]; panMove(t.clientX, t.clientY); } }, {passive:true});
  document.addEventListener('touchend', panEnd);

  // ---------- Zoom (Figma-style: pinch / Ctrl+scroll to zoom, plain scroll to pan) ----------
  viewport.addEventListener('wheel', (e) => {
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      // Smooth, continuous zoom curve (matches the small deltaY values a trackpad
      // pinch sends) anchored under the cursor, same as Figma/Google Maps.
      zoomAt(e.clientX, e.clientY, camZoom * Math.pow(1.0015, -e.deltaY));
    } else {
      e.preventDefault();
      camX -= e.deltaX; camY -= e.deltaY;
      applyTransform();
    }
  }, {passive:false});

  zoomInBtn.addEventListener('click', () => zoomAtCenter(camZoom * 1.25));
  zoomOutBtn.addEventListener('click', () => zoomAtCenter(camZoom / 1.25));
  zoomLabel.addEventListener('click', () => zoomAtCenter(1));

  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
    if(!(e.ctrlKey || e.metaKey)) return;
    if(e.key === '=' || e.key === '+'){ e.preventDefault(); zoomAtCenter(camZoom * 1.25); }
    else if(e.key === '-'){ e.preventDefault(); zoomAtCenter(camZoom / 1.25); }
    else if(e.key === '0'){ e.preventDefault(); zoomAtCenter(1); }
  });

  // ---------- Save / open canvases (kept within the site's own storage — no file
  // downloads/uploads). Named snapshots live in their own localStorage entry
  // (LIBRARY_KEY), separate from the always-on autosave of whatever canvas is
  // currently open (STORAGE_KEY, via saveState() elsewhere in this file). ----------
  const LIBRARY_KEY = 'spotify-canvas-library-v1';
  let currentCanvasId = null;
  let currentCanvasName = null;

  function getLibrary(){
    try{ return JSON.parse(localStorage.getItem(LIBRARY_KEY) || '{}'); }catch(e){ return {}; }
  }
  function setLibrary(lib){
    try{ localStorage.setItem(LIBRARY_KEY, JSON.stringify(lib)); }catch(e){}
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  saveBtn.addEventListener('click', async () => {
    const name = await promptModal('Name this canvas', currentCanvasName || 'My canvas');
    if(name === null) return;
    const trimmed = name.trim() || 'My canvas';
    const lib = getLibrary();

    let targetId;
    if(currentCanvasId && lib[currentCanvasId] && lib[currentCanvasId].name.toLowerCase() === trimmed.toLowerCase()){
      targetId = currentCanvasId;
    } else {
      const existingId = Object.keys(lib).find(id => lib[id].name.toLowerCase() === trimmed.toLowerCase());
      if(existingId){
        const ok = await confirmModal('Overwrite canvas', `A saved canvas named "${trimmed}" already exists. Overwrite it?`, 'Overwrite');
        if(!ok) return;
        targetId = existingId;
      } else {
        targetId = 'cv' + Date.now() + '_' + Math.floor(Math.random()*1e6);
      }
    }

    lib[targetId] = { id: targetId, name: trimmed, savedAt: Date.now(), camX, camY, camZoom, cards: serializeCards() };
    setLibrary(lib);
    currentCanvasId = targetId;
    currentCanvasName = trimmed;
  });

  function loadFromLibrary(id){
    const lib = getLibrary();
    const entry = lib[id];
    if(!entry) return;
    clearCanvas();
    (entry.cards || []).forEach(c => { idCounter++; makeCard(c.id || ('c'+idCounter+'_'+Date.now()), c, c.x||0, c.y||0); });
    emptyState.style.display = Object.keys(cards).length ? 'none' : 'block';
    if(typeof entry.camZoom === 'number'){
      camX = entry.camX||0; camY = entry.camY||0; camZoom = entry.camZoom;
      applyTransform();
    }
    currentCanvasId = id;
    currentCanvasName = entry.name;
    saveState();
    canvasListOverlay.classList.remove('open');
  }

  function renderCanvasList(){
    const lib = getLibrary();
    const ids = Object.keys(lib).sort((a,b) => (lib[b].savedAt||0) - (lib[a].savedAt||0));
    canvasListItems.innerHTML = '';
    if(!ids.length){
      canvasListItems.innerHTML = '<div style="color:#888;font-size:12px;padding:10px 2px;">No saved canvases yet — use "Save canvas" to create one.</div>';
      return;
    }
    ids.forEach(id => {
      const entry = lib[id];
      const row = document.createElement('div');
      row.className = 'canvas-item';
      const dateStr = entry.savedAt ? new Date(entry.savedAt).toLocaleString() : '';
      row.innerHTML = `<div class="canvas-item-main">
          <div class="canvas-item-name">${escapeHtml(entry.name)}</div>
          <div class="canvas-item-date">${dateStr}</div>
        </div>
        <button class="canvas-item-del" title="Delete">✕</button>`;
      row.querySelector('.canvas-item-main').addEventListener('click', () => loadFromLibrary(id));
      row.querySelector('.canvas-item-del').addEventListener('click', async (e) => {
        e.stopPropagation();
        const ok = await confirmModal('Delete canvas', `Delete "${entry.name}"? This can't be undone.`, 'Delete');
        if(!ok) return;
        const lib2 = getLibrary();
        delete lib2[id];
        setLibrary(lib2);
        if(currentCanvasId === id){ currentCanvasId = null; currentCanvasName = null; }
        renderCanvasList();
      });
      canvasListItems.appendChild(row);
    });
  }

  openBtn.addEventListener('click', () => { renderCanvasList(); canvasListOverlay.classList.add('open'); });
  canvasListCloseBtn.addEventListener('click', () => canvasListOverlay.classList.remove('open'));
  canvasListOverlay.addEventListener('click', (e) => { if(e.target === canvasListOverlay) canvasListOverlay.classList.remove('open'); });

  // ---------- UI wiring ----------
  authBtn.addEventListener('click', () => authPanel.classList.toggle('open'));
  connectBtn.addEventListener('click', login);
  libraryBtn.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    viewport.classList.toggle('shifted', sidebar.classList.contains('open'));
  });
  function updateThemeToggleLabel(){
    themeToggleBtn.textContent = currentTheme === 'light' ? '☾ Dark' : '☀ Light';
  }
  updateThemeToggleLabel();
  themeToggleBtn.addEventListener('click', () => {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    try{ localStorage.setItem(THEME_KEY, currentTheme); }catch(e){}
    updateThemeToggleLabel();
  });

  // ---------- init ----------
  camX = viewport.clientWidth/2 - 3000;
  camY = viewport.clientHeight/2 - 3000;
  applyTransform();

  const saved = loadState();
  if(saved.length){
    emptyState.style.display = 'none';
    saved.forEach(c => { idCounter++; makeCard(c.id || ('c'+idCounter+'_'+Date.now()), c, c.x, c.y); });
  }

  const urlParams = new URLSearchParams(location.search);
  if(urlParams.get('code')){
    exchangeCode(urlParams.get('code'));
  } else if(isLoggedIn()){
    afterLogin();
  }
})();
</script>
</body>
</html>
